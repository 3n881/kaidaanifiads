# Build one image per commit on main and roll it out to every server (EC2 or
# Lightsail), one server at a time (each server also restarts its containers
# one by one).
#
# Disabled until the repository variable DEPLOY_ENABLED is set to "true"
# (Settings → Secrets and variables → Actions → Variables). Setup:
# docs/go-live-plan.md (Stage 1D / 2), docs/deploy-lightsail.md.
#
# Servers only accept SSH from the admin's IP. On EC2, set the variable
# DEPLOY_SG_ID (security group) and the secrets AWS_DEPLOY_ACCESS_KEY_ID /
# AWS_DEPLOY_SECRET_ACCESS_KEY (IAM user limited by
# deploy/github-deploy-iam-policy.json): the job then opens SSH for this
# runner's IP only while it deploys, and always closes it again.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a rollout half way

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_META_PIXEL_IDS=${{ vars.NEXT_PUBLIC_META_PIXEL_IDS }}
            NEXT_PUBLIC_MEDIA_PROXY=${{ vars.NEXT_PUBLIC_MEDIA_PROXY }}
            DEPLOYMENT_ID=${{ steps.meta.outputs.tag }}
          secrets: |
            actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.DEPLOY_AWS_REGION || 'ap-south-1' }}
      DEPLOY_SG_ID: ${{ vars.DEPLOY_SG_ID }}
    steps:
      - name: Open SSH for this runner only (EC2 security group)
        if: vars.DEPLOY_SG_ID != ''
        run: |
          set -euo pipefail
          ip="$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "RUNNER_CIDR=${ip}/32" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$DEPLOY_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${ip}/32,Description=github-deploy}]"

      - name: Roll out to each server in turn
        env:
          # Generic names; the old LIGHTSAIL_* names still work.
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.LIGHTSAIL_SSH_KEY }}
          HOSTS: ${{ vars.DEPLOY_HOSTS || vars.LIGHTSAIL_HOSTS }} # space-separated IPs
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          image="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]'):${TAG}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh_key
          for host in $HOSTS; do
            echo "::group::Deploy $image to $host"
            ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new ubuntu@"$host" \
              "IMAGE='$image' /opt/kaf/deploy.sh"
            echo "::endgroup::"
          done

      - name: Close SSH again
        if: always() && vars.DEPLOY_SG_ID != '' && env.RUNNER_CIDR != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$DEPLOY_SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR"
