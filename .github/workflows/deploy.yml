# Build one image per commit on main and roll it out to every Lightsail server,
# one server at a time (each server also restarts its containers one by one).
#
# Disabled until the repository variable DEPLOY_ENABLED is set to "true"
# (Settings → Secrets and variables → Actions → Variables). Setup:
# docs/deploy-lightsail.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a rollout half way

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            DEPLOYMENT_ID=${{ steps.meta.outputs.tag }}
          secrets: |
            actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Roll out to each server in turn
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOSTS: ${{ vars.LIGHTSAIL_HOSTS }} # space-separated IPs
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          image="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]'):${TAG}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh_key
          for host in $HOSTS; do
            echo "::group::Deploy $image to $host"
            ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new ubuntu@"$host" \
              "IMAGE='$image' /opt/kaf/deploy.sh"
            echo "::endgroup::"
          done
